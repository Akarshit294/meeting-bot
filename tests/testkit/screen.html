<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Xebit Screencast</title>
<style>body{margin:0;width:100vw;height:100vh;background:linear-gradient(135deg,#ff6d00,#ffd600);font:bold 120px sans-serif;
color:#1a237e;display:flex;align-items:center;justify-content:center;overflow:hidden}</style>
</head><body><div id="clock">00:00:00</div>

</script></body></html>
